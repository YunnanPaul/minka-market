spring.application.name=minka-market-ecommerce
spring.config.import=optional:file:./.env[.properties]

server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/minka_market}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.default-schema=public
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=1

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

spring.jackson.time-zone=America/Lima
spring.jackson.default-property-inclusion=non_null

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-dir=${UPLOAD_DIR:./uploads}
app.image.max-bytes=${IMAGE_MAX_BYTES:5242880}

app.igv-rate=${IGV_RATE:0.18}
app.delivery-fee=${DELIVERY_FEE:5.90}
app.free-delivery-from=${FREE_DELIVERY_FROM:80.00}
app.store.name=${STORE_NAME:Minka Market}
app.store.address=${STORE_ADDRESS:Av. Los Emprendedores 245, Lima}
app.store.schedule=${STORE_SCHEDULE:Lun-Dom: 8:00 a 22:00}

logging.level.com.minkamarket.ecommerce=INFO
